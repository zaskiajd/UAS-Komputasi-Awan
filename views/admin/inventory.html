<div class="cc-panel" id="panel-admin-inventory">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-3 mb-5">
              <div>
                <h2 class="text-xl sm:text-2xl font-bold text-on-surface font-display tracking-tight">Inventaris Sarana &amp; Prasarana</h2>
                <p class="text-xs text-secondary mt-1">Daftar aset kritis, kondisi terakhir, dan jadwal pemeliharaan.</p>
              </div>
              <button type="button" class="h-11 px-5 rounded-full bg-surface-container-lowest border border-white text-xs font-bold text-on-surface shadow-sm hover:bg-surface-container-high transition flex items-center gap-2" data-action="export" data-export="assets">
                <span class="material-symbols-outlined text-base">download</span>
                Unduh Data Aset
              </button>
            </div>

            <div class="bg-surface-container-lowest rounded-2xl border border-white shadow-[0_12px_32px_-4px_rgba(20,23,26,0.05)] overflow-hidden" id="inventory-summary">
              <div class="p-5 flex flex-col gap-3 border-b border-surface-container-high">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-surface-container text-on-surface flex items-center justify-center"><span class="material-symbols-outlined text-lg">inventory_2</span></span>
                    <div>
                      <p class="font-display text-sm font-bold text-on-surface">Aset Terdaftar</p>
                      <p class="text-[11px] text-secondary" id="asset-summary-label">Memuat data aset...</p>
                    </div>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 text-[11px] font-semibold">
                    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">Baik <span data-asset-count="good">0</span></span>
                    <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800">Perlu Servis <span data-asset-count="service">0</span></span>
                    <span class="px-3 py-1 rounded-full bg-orange-100 text-primary">Gangguan <span data-asset-count="disrupted">0</span></span>
                    <span class="px-3 py-1 rounded-full bg-red-100 text-red-700">Rusak <span data-asset-count="broken">0</span></span>
                  </div>
                </div>
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                  <div class="relative flex-1">
                    <span class="material-symbols-outlined text-secondary absolute left-4 top-1/2 -translate-y-1/2 text-lg">search</span>
                    <input class="w-full h-11 pl-11 pr-4 rounded-full bg-surface-container text-on-surface placeholder:text-secondary text-xs focus:outline-none focus:bg-surface-container-high transition-colors" id="inventory-search" placeholder="Cari kode aset, nama fasilitas, atau lokasi..." type="search">
                  </div>
                  <div class="flex items-center gap-1.5 p-1 bg-surface-container rounded-full overflow-x-auto no-scrollbar shrink-0">
                    <button type="button" class="filter-chip is-active" data-inventory-filter="all">Semua</button>
                    <button type="button" class="filter-chip" data-inventory-filter="good">Baik</button>
                    <button type="button" class="filter-chip" data-inventory-filter="service">Perlu Servis</button>
                    <button type="button" class="filter-chip" data-inventory-filter="disrupted">Gangguan</button>
                    <button type="button" class="filter-chip" data-inventory-filter="broken">Rusak</button>
                  </div>
                </div>
                <p class="text-[11px] text-secondary"><span id="asset-visible-count">0</span> aset tampil pada filter ini.</p>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs min-w-[720px]">
                  <thead>
                    <tr class="text-[10px] uppercase tracking-wider text-secondary border-b border-surface-container-high">
                      <th class="py-3 px-5 font-bold">Kode Aset</th>
                      <th class="py-3 px-5 font-bold">Nama Fasilitas</th>
                      <th class="py-3 px-5 font-bold">Lokasi</th>
                      <th class="py-3 px-5 font-bold">Kondisi</th>
                      <th class="py-3 px-5 font-bold">Servis Terakhir</th>
                      <th class="py-3 px-5 font-bold text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-surface-container" id="asset-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
