<div class="cc-modal" id="modal-complaint" role="dialog" aria-modal="true" aria-labelledby="complaint-modal-title" hidden>
      <div class="cc-modal__card">
        <div class="flex items-center justify-between pb-3 border-b border-gray-100">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-lg bg-orange-100 text-brand-orange flex items-center justify-center">
              <span class="material-symbols-outlined text-xl">add</span>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900" id="complaint-modal-title">Buat Laporan Fasilitas</h3>
              <p class="text-xs text-gray-400">Ajukan pengaduan perbaikan sarana perkuliahan</p>
            </div>
          </div>
          <button type="button" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition" data-action="close-modal" aria-label="Tutup">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </div>

        <form class="mt-4 space-y-3.5" id="complaint-form">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-title">Judul Singkat Laporan</label>
            <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-title" placeholder="Cth: AC tidak dingin di Lab AI" required type="text" maxlength="90">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-category">Kategori Fasilitas</label>
            <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-category" required>
              <option value="">Pilih kategori kerusakan...</option>
              <option value="Kelistrikan &amp; AC">Air Conditioner (AC) &amp; Kelistrikan</option>
              <option value="Proyektor &amp; Audio">Proyektor / LCD &amp; Sound System</option>
              <option value="Jaringan Wi-Fi">Koneksi Internet &amp; Router Wi-Fi Kampus</option>
              <option value="Sanitasi / Toilet">Sanitasi, Kran Air &amp; Toilet</option>
              <option value="Meja / Kursi Kuliah">Meja, Kursi &amp; Fasilitas Ruang Kuliah</option>
              <option value="Lift / Akses Gedung">Lift / Pintu Otomatis / Fasilitas Disabilitas</option>
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-building">Gedung Kampus</label>
              <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-building" required>
                <option>Gedung A (Rektorat)</option>
                <option>Gedung B (Teknik Sipil)</option>
                <option>Gedung C (Fakultas Ilmu Komputer)</option>
                <option>Gedung D (Perpustakaan Pusat)</option>
                <option>Gedung E (Laboratorium Bersama)</option>
                <option>Gedung F (Fakultas Teknik)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-room">Ruang / Nomor Lantai</label>
              <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-room" placeholder="Cth: Lab AI - Lt. 3" required type="text">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-priority">Tingkat Prioritas</label>
            <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-priority">
              <option value="Sedang">Sedang — mengganggu tetapi masih bisa digunakan</option>
              <option value="Tinggi">Tinggi — menghentikan aktivitas perkuliahan</option>
              <option value="Rendah">Rendah — perbaikan terjadwal</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="complaint-desc">Deskripsi Kerusakan</label>
            <textarea class="w-full text-xs font-medium rounded-xl border-gray-200 focus:border-brand-orange focus:ring-brand-orange bg-gray-50 p-2.5" id="complaint-desc" placeholder="Jelaskan detail kendala (Cth: AC berbunyi bising dan tidak dingin saat perkuliahan jam 08.00)..." required rows="3"></textarea>
          </div>
          <button type="button" class="w-full border-2 border-dashed border-gray-200 rounded-2xl p-3 text-center hover:border-brand-orange transition cursor-pointer bg-gray-50/50" data-action="demo" data-note="Unggah foto: fitur unggah akan terhubung ke object storage.">
            <span class="material-symbols-outlined text-2xl text-gray-400">add_photo_alternate</span>
            <span class="block text-[11px] font-semibold text-gray-600 mt-1">Klik untuk lampirkan foto fasilitas rusak</span>
            <span class="block text-[9px] text-gray-400">Format PNG, JPG maks 5MB</span>
          </button>
          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" class="px-4 py-2 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-100 transition" data-action="close-modal">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-full text-xs font-bold bg-brand-orange hover:bg-orange-600 text-white shadow-lg shadow-orange-500/25 transition">Kirim Pengaduan</button>
          </div>
        </form>
      </div>
    </div>
