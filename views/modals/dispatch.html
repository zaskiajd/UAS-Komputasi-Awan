<div class="cc-modal" id="modal-dispatch" role="dialog" aria-modal="true" aria-labelledby="dispatch-modal-title" hidden>
      <div class="cc-modal__card">
        <div class="flex items-center justify-between pb-3 border-b border-gray-100">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-lg bg-orange-100 text-primary-container flex items-center justify-center">
              <span class="material-symbols-outlined text-xl font-bold">bolt</span>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900 font-display" id="dispatch-modal-title">Disposisi Penugasan Cepat</h3>
              <p class="text-xs text-gray-500">Tugaskan teknisi lapangan ke tiket prioritas</p>
            </div>
          </div>
          <button type="button" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition" data-action="close-modal" aria-label="Tutup">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </div>

        <form class="mt-4 space-y-3.5" id="dispatch-form">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="ticket-select">Tiket Masuk</label>
            <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="ticket-select" required></select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1" for="dispatch-team">Tim Teknisi</label>
              <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="dispatch-team" required></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1" for="dispatch-priority">Tingkat Prioritas</label>
              <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="dispatch-priority" required>
                <option value="Tinggi">Tinggi (SLA &lt; 2 Jam)</option>
                <option value="Sedang">Sedang (SLA &lt; 6 Jam)</option>
                <option value="Rendah">Rendah (SLA 24 Jam)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="dispatch-assignee">Teknisi Penanggung Jawab (PIC)</label>
            <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5 disabled:opacity-60 disabled:cursor-not-allowed" id="dispatch-assignee" required></select>
            <p class="text-[11px] text-secondary mt-1 leading-relaxed" id="dispatch-assignee-hint">Memuat personil tim...</p>
          </div>
          <div>
            <div class="flex items-center justify-between gap-2 mb-1">
              <label class="block text-xs font-bold text-gray-700">Teknisi Pendukung (opsional)</label>
              <span class="text-[10px] text-gray-500">Bisa lebih dari satu</span>
            </div>
            <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1" id="dispatch-support-list"></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="dispatch-note">Instruksi Khusus untuk Teknisi</label>
            <textarea class="w-full text-xs font-medium rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="dispatch-note" placeholder="Bawa tangga lipat dan periksa unit kondensor AC luar gedung..." rows="3"></textarea>
            <p class="text-[10px] text-gray-500 mt-1">Instruksi disimpan sebagai pesan terarah untuk PIC yang dipilih.</p>
          </div>
          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" class="px-4 py-2 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-100 transition" data-action="close-modal">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-full text-xs font-bold bg-primary-container hover:brightness-110 text-white shadow-lg shadow-orange-500/25 transition disabled:opacity-50 disabled:cursor-not-allowed" id="dispatch-submit">Kirim Disposisi Tugas</button>
          </div>
        </form>
      </div>
    </div>
