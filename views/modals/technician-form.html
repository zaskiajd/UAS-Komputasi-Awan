<div class="cc-modal" id="modal-technician-form" role="dialog" aria-modal="true" aria-labelledby="technician-form-title" hidden>
  <div class="cc-modal__card max-w-2xl">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-primary-fixed text-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">person_add</span>
        </div>
        <div>
          <h3 class="text-base font-bold text-gray-900 font-display" id="technician-form-title">Tambah Teknisi</h3>
          <p class="text-xs text-gray-500" id="technician-form-subtitle">Lengkapi data personil baru untuk tim lapangan Sarpras.</p>
        </div>
      </div>
      <button type="button" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition" data-action="close-modal" aria-label="Tutup">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <form class="mt-4 space-y-3.5" id="technician-form">
      <input type="hidden" id="tech-form-id" value="">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-name">Nama Pendek</label>
          <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-name" placeholder="Contoh: Budi" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-title">Nama Tampilan</label>
          <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-title" placeholder="Contoh: Pak Budi">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-team">Tim Penempatan</label>
          <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-team" required></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-role">Peran</label>
          <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-role">
            <option value="Teknisi">Teknisi</option>
            <option value="Koordinator">Koordinator</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-phone">Nomor Telepon</label>
          <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-phone" placeholder="+62 812-0000-000">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-active">Status Siaga</label>
          <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-active">
            <option value="active">Bertugas</option>
            <option value="standby">Standby</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1" for="tech-form-skills">Keahlian</label>
        <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="tech-form-skills" placeholder="AC split, Kelistrikan, Genset">
        <p class="text-[10px] text-gray-500 mt-1">Pisahkan beberapa keahlian dengan koma.</p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button" class="px-4 py-2 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-100 transition" data-action="close-modal">Batal</button>
        <button type="submit" class="px-5 py-2.5 rounded-full text-xs font-bold bg-primary-container hover:brightness-110 text-white shadow-lg shadow-orange-500/25 transition" id="tech-form-submit">Tambah Teknisi</button>
      </div>
    </form>
  </div>
</div>
