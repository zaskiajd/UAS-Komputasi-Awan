<div class="cc-modal" id="modal-delete-history" role="dialog" aria-modal="true" aria-labelledby="delete-history-title" hidden>
  <div class="cc-modal__card">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-red-100 text-red-600 flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">delete_forever</span>
        </div>
        <div>
          <h3 class="text-base font-bold text-gray-900" id="delete-history-title">Hapus Riwayat Pengaduan</h3>
          <p class="text-xs text-gray-400">Konfirmasi riwayat yang akan dihapus</p>
        </div>
      </div>
      <button type="button" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition" data-action="close-modal" aria-label="Tutup">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <div class="mt-4 space-y-3.5">
      <div>
        <span class="block text-xs font-bold text-gray-700 mb-1">Riwayat Terpilih</span>
        <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">
          <p class="text-xs text-gray-600 leading-relaxed">
            Anda akan menghapus <strong class="text-gray-900" id="delete-history-count">0 riwayat pengaduan</strong> dari daftar pengaduan saya.
          </p>
          <ul class="mt-3 max-h-44 overflow-y-auto flex flex-col gap-2" id="delete-history-preview"></ul>
        </div>
      </div>

      <div class="rounded-xl border border-amber-200 bg-amber-50 p-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base text-amber-600 mt-0.5">info</span>
        <p class="text-[11px] text-amber-800 leading-relaxed">Riwayat yang sudah dihapus tidak dapat dikembalikan. Pastikan pilihan Anda sudah benar sebelum melanjutkan.</p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-2">
      <button type="button" class="px-4 py-2 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-100 transition" data-action="close-modal">Batal</button>
      <button type="button" class="px-5 py-2 rounded-full text-xs font-bold bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-500/25 transition flex items-center gap-1.5" data-action="execute-delete-history">
        <span class="material-symbols-outlined text-base">delete</span>
        Hapus Riwayat
      </button>
    </div>
  </div>
</div>
