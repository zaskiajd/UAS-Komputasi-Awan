<div class="cc-modal" id="modal-asset-form" role="dialog" aria-modal="true" aria-labelledby="asset-form-title" hidden>
  <div class="cc-modal__card max-w-2xl">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">inventory_2</span>
        </div>
        <div>
          <h3 class="text-base font-bold text-gray-900 font-display" id="asset-form-title">Tambah Aset</h3>
          <p class="text-xs text-gray-500" id="asset-form-subtitle">Lengkapi data aset baru. Kode aset dibuat otomatis.</p>
        </div>
      </div>
      <button type="button" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition" data-action="close-modal" aria-label="Tutup">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <form class="mt-4 space-y-3.5" id="asset-form">
      <input type="hidden" id="asset-form-id" value="">

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-name">Nama Fasilitas</label>
        <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-name" placeholder="Contoh: AC Split 2 PK — Lab Komputer 3" required>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-cat">Kategori</label>
          <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-cat" required></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-condition">Kondisi</label>
          <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-condition" required></select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-location">Lokasi</label>
          <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-location" placeholder="Contoh: Gedung F • Lt. 2" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-zone">Zona Kampus</label>
          <input class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-zone" placeholder="Contoh: FT / GKB / Rektorat" required>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-team">Tim Penanggung Jawab</label>
        <select class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-team" required></select>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1" for="asset-form-note">Catatan Kondisi</label>
        <textarea class="w-full text-xs font-semibold rounded-xl border-gray-200 focus:border-primary-container focus:ring-primary-container bg-gray-50 p-2.5" id="asset-form-note" rows="3" placeholder="Deskripsi singkat kondisi aset saat ini."></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button" class="px-4 py-2 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-100 transition" data-action="close-modal">Batal</button>
        <button type="submit" class="px-5 py-2.5 rounded-full text-xs font-bold bg-primary-container hover:brightness-110 text-white shadow-lg shadow-orange-500/25 transition" id="asset-form-submit">Tambah Aset</button>
      </div>
    </form>
  </div>
</div>
