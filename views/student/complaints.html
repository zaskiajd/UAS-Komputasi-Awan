<div class="cc-panel" id="panel-student-complaints">

            <!-- Detail tiket (diisi JS) -->
            <div id="student-detail-card" class="mb-6" hidden></div>

            <div class="bg-surface-container-lowest rounded-2xl p-5 sm:p-6 shadow-[0_12px_32px_-4px_rgba(20,23,26,0.04)] border border-[#e2e8f0]">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div>
                  <h2 class="text-xl sm:text-2xl font-bold text-on-surface font-display tracking-tight">Pengaduan Saya</h2>
                  <p class="text-xs text-secondary mt-1">Seluruh laporan fasilitas atas nama Anda, lengkap dengan detail dan timeline penanganan.</p>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                  <!-- Tombol Hapus Riwayat -->
                  <button type="button" id="btn-delete-history" class="h-11 px-4 rounded-full bg-surface-container hover:bg-error-container text-secondary hover:text-on-error-container text-xs font-bold border border-surface-container-high hover:border-error-container transition-all flex items-center gap-1.5" data-action="delete-history" aria-pressed="false" aria-controls="student-history-toolbar">
                    <span class="material-symbols-outlined text-base">delete_sweep</span>
                    Hapus Riwayat
                  </button>
                  <button type="button" class="h-11 px-5 rounded-full bg-primary-container hover:bg-primary-hover text-white text-xs font-bold shadow-[0_10px_24px_-8px_rgba(255,102,31,0.6)] transition-all flex items-center justify-center gap-2" data-action="open-complaint">
                    <span class="material-symbols-outlined text-base">add</span>
                    Buat Pengaduan Baru
                  </button>
                </div>
              </div>

              <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3 mt-5">
                <div class="relative flex-1">
                  <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary text-lg pointer-events-none">search</span>
                  <input type="search" id="student-search" class="w-full h-11 pl-11 pr-4 rounded-full bg-surface-container border border-transparent text-xs font-medium text-on-surface placeholder:text-secondary focus:outline-none focus:bg-surface-container-high transition-colors" placeholder="Cari kode tiket, fasilitas, atau lokasi...">
                </div>
                <div class="flex items-center gap-1 p-1 bg-surface-container rounded-full overflow-x-auto no-scrollbar shrink-0">
                  <button type="button" class="filter-chip is-active" data-student-filter="all">Semua <span data-student-count="all">0</span></button>
                  <button type="button" class="filter-chip" data-student-filter="review">Verifikasi <span data-student-count="review">0</span></button>
                  <button type="button" class="filter-chip" data-student-filter="progress">Diproses <span data-student-count="progress">0</span></button>
                  <button type="button" class="filter-chip" data-student-filter="done">Selesai <span data-student-count="done">0</span></button>
                </div>
              </div>

              <!-- Mode pilih riwayat: muncul setelah tombol Hapus Riwayat ditekan -->
              <div id="student-history-toolbar" class="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 rounded-2xl border border-[#fecaca] bg-[#fff1f0] px-4 py-3" hidden>
                <div class="flex items-center gap-3">
                  <span class="w-10 h-10 rounded-full bg-white text-[#b91c1c] flex items-center justify-center shadow-sm shrink-0">
                    <span class="material-symbols-outlined text-xl">checklist</span>
                  </span>
                  <div>
                    <p class="text-xs font-bold text-[#7f1d1d]">Pilih riwayat yang ingin dihapus</p>
                    <p class="text-[11px] font-medium text-[#b91c1c]" id="student-history-selected-count">0 riwayat dipilih</p>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" id="btn-select-all-history" class="h-9 px-3.5 rounded-full bg-white text-[#7f1d1d] text-[11px] font-bold border border-[#fecaca] hover:bg-[#ffe4e2] transition-colors" data-action="select-all-history" aria-pressed="false">
                    Pilih semua
                  </button>
                  <button type="button" class="h-9 px-3.5 rounded-full text-[#7f1d1d] text-[11px] font-bold hover:bg-white/70 transition-colors" data-action="cancel-delete-history">
                    Batal
                  </button>
                  <button type="button" id="btn-confirm-delete-history" class="h-9 px-4 rounded-full bg-[#b91c1c] text-white text-[11px] font-bold shadow-[0_8px_18px_-8px_rgba(185,28,28,0.9)] hover:bg-[#991b1b] disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none transition-all flex items-center gap-1.5" data-action="confirm-delete-history" disabled>
                    <span class="material-symbols-outlined text-base">delete</span>
                    Hapus riwayat
                  </button>
                </div>
              </div>

              <div class="flex flex-col gap-3.5 mt-5" id="student-report-list"></div>
            </div>
          </div>
