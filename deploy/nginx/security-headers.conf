# =============================================================================
# security-headers.conf — header keamanan dasar untuk file statis frontend
# -----------------------------------------------------------------------------
# Di-include oleh setiap location statis di default.conf. Dibuat terpisah
# karena aturan Nginx: begitu sebuah location punya "add_header" sendiri
# (mis. Cache-Control), header dari level server TIDAK diwariskan lagi.
#
# Sengaja TIDAK ada Content-Security-Policy dan Cross-Origin-Opener-Policy:
# tombol "Masuk dengan Google" memuat skrip + iframe dari accounts.google.com,
# dan CSP/COOP yang ketat bisa merusaknya. Lihat docs/DEPLOY.md.
#
# Respons /api/* tidak memakai file ini: header keamanan API sudah diatur
# oleh backend (helmet).
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
