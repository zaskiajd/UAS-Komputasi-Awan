# =============================================================================
# deploy/nginx/default.conf — Konfigurasi Nginx untuk CampusCare
# -----------------------------------------------------------------------------
# Alur permintaan:
#   pengguna → Cloudflare → cloudflared → Nginx (container "web", port 80)
#     - /api/*   → diteruskan (proxy) ke container "api" (Express, port 3000)
#     - lainnya  → file statis frontend dari /usr/share/nginx/html
#
# Frontend dan API berada di SATU domain (same-origin), jadi tidak ada
# masalah CORS. HTTPS diurus Cloudflare; Nginx cukup HTTP biasa di port 80.
#
# File ini di-include di dalam blok "http" milik Nginx, sehingga "map" dan
# "log_format" boleh ditulis di luar blok "server".
# =============================================================================

# --- IP pengunjung asli -------------------------------------------------------
# Lewat Cloudflare, $remote_addr berisi IP cloudflared, bukan IP pengunjung.
# Cloudflare mengirim IP asli di header CF-Connecting-IP. Bila header itu ada,
# pakai; bila tidak (mis. diakses langsung dari jaringan lokal), pakai $remote_addr.
# Backend memakai "trust proxy = 1" dan rate limiter per IP, jadi nilai ini
# penting agar pengunjung yang berbeda tidak dianggap satu IP yang sama.
map $http_cf_connecting_ip $cc_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# --- Protokol asli (http/https) -------------------------------------------------
# TLS diakhiri di Cloudflare, jadi Nginx hanya melihat "http". Cloudflare
# mengirim protokol aslinya di X-Forwarded-Proto; teruskan apa adanya bila ada.
map $http_x_forwarded_proto $cc_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# --- Koneksi WebSocket --------------------------------------------------------
# Notifikasi real-time memakai WebSocket di /api/ws. Upgrade HTTP khusus
# hanya boleh berlaku di location itu, jadi dipetakan lewat variabel:
# bila request membawa header Upgrade, "Connection" diisi "upgrade";
# bila tidak (REST biasa), diisi kosong agar keep-alive tetap bekerja.
# Catatan: Cloudflare mendukung WebSocket untuk semua paket.
map $http_upgrade $cc_connection_upgrade {
    default upgrade;
    ""      close;
}

# Format log akses yang mencatat IP pengunjung asli (bukan IP cloudflared).
log_format campuscare '$cc_client_ip - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

server {
    listen 80;
    server_name _;

    # Sembunyikan versi Nginx di header dan halaman error.
    server_tokens off;

    # Redirect memakai path relatif (mis. /views → /views/), supaya tidak
    # berubah menjadi http://...:80 saat diakses lewat https Cloudflare.
    absolute_redirect off;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log campuscare;

    # --- Kompresi gzip -------------------------------------------------------
    # text/html selalu dikompres bila gzip aktif; tipe lain didaftarkan di sini.
    # Font woff2 sudah terkompres, jadi tidak perlu.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # --- Alamat container API -------------------------------------------------
    # 127.0.0.11 adalah DNS internal Docker. Alamat "api" disimpan di variabel
    # supaya Nginx mencari ulang IP container api (berlaku 10 detik). Manfaatnya:
    #   1) bila container api dibuat ulang (IP berubah), Nginx tidak 502 terus;
    #   2) Nginx tetap bisa start / lolos "nginx -t" walau api belum hidup.
    # Karena variabel tidak berisi path, URI asli (/api/...) diteruskan apa adanya,
    # sama seperti "proxy_pass http://api:3000;".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cc_api_upstream http://api:3000;

    # --- Blokir dotfile -----------------------------------------------------
    # Menolak akses ke berkas tersembunyi seperti /.env atau /.git/config.
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- Health check API (untuk pengecekan dari luar) --------------------------
    # https://DOMAIN_ANDA/api/health → backend juga mengecek koneksi database.
    location = /api/health {
        proxy_pass $cc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_client_ip;
        proxy_set_header X-Forwarded-For $cc_client_ip;
        proxy_set_header X-Forwarded-Proto $cc_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        # Health check bisa dipanggil sering; tidak perlu memenuhi log akses.
        access_log off;
    }

    # --- Foto pengaduan ------------------------------------------------------
    # Foto disimpan backend di UPLOAD_DIR dan disajikan sebagai
    # /uploads/<uuid>.<ext>. Jangan memakai include security-headers.conf di
    # sini: header dari location akan menimpa Cross-Origin-Resource-Policy dan
    # Cache-Control yang sudah diatur backend (frontend dev :8000 memuat foto
    # dari API :3000 secara cross-origin).
    location ^~ /uploads/ {
        proxy_pass $cc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_client_ip;
        proxy_set_header X-Forwarded-For $cc_client_ip;
        proxy_set_header X-Forwarded-Proto $cc_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- WebSocket notifikasi real-time --------------------------------------
    # /api/ws ditangani SEBELUM location /api/ (prefix lebih panjang menang).
    # Koneksi ditingkatkan (Upgrade) dan boleh hidup lama; baca timeout 1 jam
    # sekaligus menolak body (WebSocket tidak memakai body).
    location = /api/ws {
        proxy_pass $cc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_client_ip;
        proxy_set_header X-Forwarded-For $cc_client_ip;
        proxy_set_header X-Forwarded-Proto $cc_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ------------------------------------------------------------
    # "^~" membuat semua /api/... langsung ke sini (tidak dicocokkan dengan
    # aturan file statis .js/.css di bawah).
    location ^~ /api/ {
        proxy_pass $cc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_client_ip;
        # Diisi IP pengunjung asli saja (bukan rantai), karena Express dengan
        # "trust proxy = 1" membaca entri terakhir X-Forwarded-For.
        proxy_set_header X-Forwarded-For $cc_client_ip;
        proxy_set_header X-Forwarded-Proto $cc_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Maksimal 3 foto × 3 MB + overhead multipart. Backend tetap menegakkan
        # batas 3 MB per berkas dan 3 berkas per permintaan.
        client_max_body_size 12m;
    }

    # --- File statis frontend ------------------------------------------------
    # Tidak ada fingerprint/hash di nama file (tanpa build), jadi HTML dan JS
    # memakai "no-cache": browser boleh menyimpan, tetapi WAJIB menanyakan ke
    # server dulu apakah file berubah. Perubahan kode langsung terbaca dan
    # tidak ada JS lama yang "tersangkut" di browser.

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Partial HTML (views/). File yang tidak ada → 404 sungguhan, bukan
    # index.html, supaya pesan error pemuat partial jelas.
    location /views/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Halaman utama. Frontend memakai hash routing (#student, #admin), jadi
    # semua path yang bukan file dikembalikan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ES module JavaScript: selalu dicek ulang (no-cache).
    location ~* \.(?:js|mjs)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # CSS: boleh disimpan browser 1 jam.
    location ~* \.css$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Font dan gambar: boleh disimpan browser 1 jam.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
