<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CampusCare UNSIL — satu portal terpadu untuk pengaduan fasilitas, monitoring sarana, dan disposisi teknisi Universitas Siliwangi.">
  <title>CampusCare UNSIL — Portal Pengaduan &amp; Monitoring Fasilitas Kampus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff661f'/%3E%3Cpath d='M16 7 5 12.5l11 5.5 8.2-4.1V20h2.3v-8.7L16 7zm-6 9.3v4.4c0 1.6 2.7 3.3 6 3.3s6-1.7 6-3.3v-4.4l-6 3-6-3z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS (utility layer) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#a73a00',
              container: '#ff661f',
              hover: '#e55615',
              fixed: '#ffdbce'
            },
            'on-primary': '#ffffff',
            'on-primary-fixed': '#370e00',
            'on-primary-fixed-variant': '#802a00',
            surface: {
              DEFAULT: '#f7f9fd',
              container: '#eceef2',
              'container-low': '#f2f4f8',
              'container-lowest': '#ffffff',
              'container-high': '#e6e8ec',
              'container-highest': '#e0e2e6',
              dim: '#d8dade',
              bright: '#f7f9fd',
              variant: '#e0e2e6'
            },
            'on-surface': '#191c1f',
            'on-surface-variant': '#5a4138',
            'inverse-surface': '#1e293b',
            'inverse-on-surface': '#eff1f5',
            secondary: '#5c5f62',
            tertiary: '#0053db',
            'tertiary-fixed': '#dbe1ff',
            'on-tertiary-fixed-variant': '#003ea8',
            error: '#ba1a1a',
            'error-container': '#ffdad6',
            'on-error-container': '#93000a',
            brand: {
              orange: '#FF661F',
              dark: '#14171A',
              lightGray: '#F3F4F6',
              bgCanvas: '#E4E7EC',
              cardBg: 'rgba(255, 255, 255, 0.85)'
            }
          },
          fontFamily: {
            sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'glow-orange': '0 8px 25px -4px rgba(255, 102, 31, 0.45)',
            'floating-glass': '0 24px 60px -12px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.85)',
            'dock-pill': '0 10px 25px -5px rgba(0, 0, 0, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9)',
            glass: '0 8px 32px 0 rgba(0, 0, 0, 0.06)',
            'glass-inset': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.8)',
            floating: '0 20px 40px -15px rgba(20, 23, 26, 0.08)'
          }
        }
      }
    };
  </script>

  <!-- Stylesheet modular (urutan penting: token → base → layout → komponen → halaman → responsif) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>

<body data-view="auth" class="antialiased cc-booting">

  <!-- Kontainer aplikasi — isinya dimuat dari partial HTML di folder views/ -->
  <div id="app">
    <div data-include="views/auth.html"></div>
    <div data-include="views/student.html"></div>
    <div data-include="views/admin.html"></div>
    <div data-include="views/modals/sso-help.html"></div>
    <div data-include="views/modals/toast.html"></div>
  </div>

  <!-- Layar muat & pesan bila partial gagal dimuat (mis. dibuka via file://) -->
  <div id="boot-screen" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-title">Memuat CampusCare…</p>
      <p class="boot-text">Menyiapkan antarmuka portal.</p>
    </div>
  </div>

  <div id="boot-error" role="alert" hidden>
    <div class="boot-card">
      <span class="material-symbols-outlined boot-error-icon">dns</span>
      <p class="boot-title">Antarmuka tidak dapat dimuat</p>
      <p class="boot-text">
        Aplikasi ini memuat partial HTML, jadi harus dijalankan lewat web server
        (bukan dibuka langsung sebagai <code>file://</code>).
      </p>
      <pre class="boot-code">python -m http.server 8000
# lalu buka http://localhost:8000</pre>
      <p class="boot-detail" id="boot-error-detail"></p>
    </div>
  </div>

  <noscript>
    <style>#boot-screen { display: none !important; }</style>
    <div class="boot-noscript">
      <div class="boot-card">
        <p class="boot-title">JavaScript diperlukan</p>
        <p class="boot-text">Aktifkan JavaScript untuk menjalankan portal CampusCare.</p>
      </div>
    </div>
  </noscript>

  <!-- Penjaga non-module: module script diblokir saat halaman dibuka via file:// -->
  <script>
    if (window.location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", function () {
        var detail = document.getElementById("boot-error-detail");
        var panel = document.getElementById("boot-error");
        var screen = document.getElementById("boot-screen");
        document.body.classList.remove("cc-booting");
        if (screen) screen.remove();
        if (detail) detail.textContent = "Alamat saat ini dimulai dengan file:// bukan http://.";
        if (panel) panel.hidden = false;
      });
    }
  </script>

  <!-- JavaScript aplikasi (ES module, dimuat setelah partial siap) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
