<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CampusCare UNSIL — satu portal terpadu untuk pengaduan fasilitas, monitoring sarana, dan disposisi teknisi Universitas Siliwangi.">
  <title>CampusCare UNSIL — Portal Pengaduan &amp; Monitoring Fasilitas Kampus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff661f'/%3E%3Cpath d='M16 7 5 12.5l11 5.5 8.2-4.1V20h2.3v-8.7L16 7zm-6 9.3v4.4c0 1.6 2.7 3.3 6 3.3s6-1.7 6-3.3v-4.4l-6 3-6-3z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Font lokal (self-hosted): Space Grotesk, Plus Jakarta Sans, Material Symbols -->
  <link rel="stylesheet" href="css/fonts.css">

  <!-- Stylesheet modular (urutan penting: token → base → layout → komponen → halaman → responsif) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/utilities.css">

  <!-- Tailwind CSS hasil kompilasi (utility layer, tidak butuh koneksi internet).
       Dimuat paling akhir agar utilitas tetap menimpa gaya komponen, sama seperti
       perilaku Tailwind Play CDN yang dulu menyuntik <style> di akhir <head>. -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Gaya mode debug (panel log, tombol DEBUG, peringatan tampilan kosong). -->
  <link rel="stylesheet" href="css/debug.css">
</head>

<body data-view="auth" class="antialiased cc-booting">

  <!-- Kontainer aplikasi — isinya dimuat dari partial HTML di folder views/ -->
  <div id="app">
    <div data-include="views/auth.html"></div>
    <div data-include="views/student.html"></div>
    <div data-include="views/admin.html"></div>
    <div data-include="views/modals/sso-help.html"></div>
    <div data-include="views/modals/toast.html"></div>
  </div>

  <!-- Layar muat & pesan bila partial gagal dimuat (mis. dibuka via file://) -->
  <div id="boot-screen" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-title">Memuat CampusCare…</p>
      <p class="boot-text">Menyiapkan antarmuka portal.</p>
    </div>
  </div>

  <div id="boot-error" role="alert" hidden>
    <div class="boot-card">
      <span class="material-symbols-outlined boot-error-icon">dns</span>
      <p class="boot-title">Antarmuka tidak dapat dimuat</p>
      <p class="boot-text">
        Aplikasi ini memuat partial HTML, jadi harus dijalankan lewat web server
        (bukan dibuka langsung sebagai <code>file://</code>).
      </p>
      <pre class="boot-code">python -m http.server 8000
# lalu buka http://localhost:8000</pre>
      <p class="boot-detail" id="boot-error-detail"></p>
      <pre class="boot-code boot-diag" id="boot-error-diag" hidden></pre>
      <div class="boot-actions" id="boot-error-actions">
        <button type="button" class="boot-btn boot-btn--primary" data-boot-action="debug">Diagnosa cepat</button>
        <button type="button" class="boot-btn" data-boot-action="reload">Muat ulang</button>
      </div>
    </div>
  </div>

  <noscript>
    <style>#boot-screen { display: none !important; }</style>
    <div class="boot-noscript">
      <div class="boot-card">
        <p class="boot-title">JavaScript diperlukan</p>
        <p class="boot-text">Aktifkan JavaScript untuk menjalankan portal CampusCare.</p>
      </div>
    </div>
  </noscript>

  <!-- Penjaga non-module: module script diblokir saat halaman dibuka via file:// -->
  <script>
    if (window.location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", function () {
        var detail = document.getElementById("boot-error-detail");
        var panel = document.getElementById("boot-error");
        var screen = document.getElementById("boot-screen");
        document.body.classList.remove("cc-booting");
        if (screen) screen.remove();
        if (detail) detail.textContent = "Alamat saat ini dimulai dengan file:// bukan http://.";
        if (panel) panel.hidden = false;
      });
    }
  </script>

  <!-- Aksi pada panel galat boot. Ditangani inline (bukan di js/main.js) supaya
       tombol tetap berfungsi ketika modul aplikasi sendiri gagal dimuat. -->
  <script>
    (function () {
      var actions = document.getElementById("boot-error-actions");
      if (actions) actions.dataset.bound = "inline";

      function sheetsReport() {
        var links = document.querySelectorAll('link[rel="stylesheet"]');
        if (!links.length) return "  (tidak ada stylesheet tertaut)";
        return Array.prototype.map
          .call(links, function (link) {
            var loaded = "?";
            try {
              loaded = link.sheet ? link.sheet.cssRules.length + " aturan" : "TIDAK termuat";
            } catch (error) {
              loaded = "tidak bisa dibaca";
            }
            return "  " + (link.getAttribute("href") || "?") + " → " + loaded;
          })
          .join("\n");
      }

      function quickDiagnose() {
        if (window.ccDebug && typeof window.ccDebug.diagnose === "function") {
          window.ccDebug.open();
          return window.ccDebug.diagnose();
        }

        var views = ["auth", "student", "admin"].filter(function (name) {
          return document.getElementById("view-" + name);
        });

        var lines = [
          "Diagnosa cepat CampusCare",
          "Waktu       : " + new Date().toLocaleString("id-ID"),
          "URL         : " + window.location.href,
          "Protokol    : " + window.location.protocol,
          "Viewport    : " + window.innerWidth + "x" + window.innerHeight,
          "Status boot : " + (document.body.classList.contains("cc-booting") ? "belum selesai" : "selesai"),
          "Modul inti  : " + (window.__ccReady ? "aktif" : "TIDAK termuat"),
          "",
          "Stylesheet:",
          sheetsReport(),
          "",
          "Partial belum dimuat : " + document.querySelectorAll("[data-include]").length,
          "View ditemukan       : " + (views.length ? views.join(", ") : "tidak ada"),
          "Panel terkumpul      : " + document.querySelectorAll(".cc-panel").length,
          "Modul <script>       : " + document.querySelectorAll('script[type="module"]').length
        ];

        var diag = document.getElementById("boot-error-diag");
        if (diag) {
          diag.textContent = lines.join("\n");
          diag.hidden = false;
        }
        console.log("[CampusCare] " + lines.join("\n"));
      }

      document.addEventListener("click", function (event) {
        var button = event.target.closest("[data-boot-action]");
        if (!button) return;
        if (button.dataset.bootAction === "debug") quickDiagnose();
        if (button.dataset.bootAction === "reload") window.location.reload();
      });
    })();
  </script>

  <!-- JavaScript aplikasi (ES module, dimuat setelah partial siap) -->
  <script type="module" src="js/main.js"></script>

  <!-- Pemantau boot: bila modul inti tidak pernah selesai dimuat, tampilkan pesan
       yang jelas alih-alih membiarkan layar "Memuat CampusCare…" menggantung. -->
  <script>
    window.setTimeout(function () {
      if (window.location.protocol === "file:") return;
      if (!document.body.classList.contains("cc-booting")) return;

      var panel = document.getElementById("boot-error");
      var detail = document.getElementById("boot-error-detail");
      var screen = document.getElementById("boot-screen");

      document.body.classList.remove("cc-booting");
      if (screen) screen.remove();
      if (detail) {
        detail.textContent =
          "Modul aplikasi tidak selesai dimuat. Pastikan folder js/ dan views/ lengkap, lalu muat ulang dengan Ctrl+F5.";
      }
      if (panel) panel.hidden = false;
    }, 8000);
  </script>
</body>
</html>
